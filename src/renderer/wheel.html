<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' media:">
<title>Lime</title>
<link rel="stylesheet" href="lime.css">
<link rel="stylesheet" href="wheel.css">
</head>
<body>
<div id="stage" class="idle">
  <div class="tab" title="Lime: drop files here, or click"><div class="tab-lime"><svg class="tab-ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/></svg></div></div>
  <div class="pill" role="tablist" aria-label="Mode"></div>
  <button class="close" type="button" title="Close (Esc)" aria-label="Close"></button>
  <div class="wheel">
    <svg class="dial" viewBox="-150 -150 300 300" aria-hidden="true">
      <defs>
        <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-glass-hi"/><stop offset="1" class="s-glass-lo"/></linearGradient>
        <linearGradient id="gHot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-hot-hi"/><stop offset="1" class="s-hot-lo"/></linearGradient>
        <linearGradient id="gSheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" class="s-sheen"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="gEdge" gradientUnits="userSpaceOnUse" x1="0" y1="-150" x2="0" y2="150"><stop offset="0" class="s-edge-hi"/><stop offset=".55" class="s-edge-lo"/><stop offset="1" class="s-edge-hi" stop-opacity=".5"/></linearGradient>
        <radialGradient id="gBezel" r=".5"><stop offset=".36" class="s-bezel-in"/><stop offset=".9" class="s-bezel"/><stop offset="1" class="s-bezel-out"/></radialGradient>
        <linearGradient id="gProg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6dc5e"/><stop offset="1" stop-color="#3f8a1c"/></linearGradient>
      </defs>
      <circle class="bezel" r="147"/>
      <circle class="bezel-edge" r="146.5"/>
      <circle class="bezel-line" r="147.5"/>
      <circle class="hole" r="54"/>
      <circle class="halo" r="147"/>
      <g class="petals"></g>
      <path class="prog" d=""/>
      <circle class="btn" r="54"/>
    </svg>
    <div class="center" draggable="false"></div>
  </div>
  <div class="caption"><b class="name"></b><span class="meta"></span></div>
  <div class="card" hidden></div>
</div>
<script type="module" src="wheel.js"></script>
</body>
</html>
