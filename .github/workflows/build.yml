name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSES/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            name: Lime-mac-arm64
            script: dist:mac
            asset: dist/*.dmg
            app: dist/Lime-darwin-arm64/Lime.app/Contents/Resources/app
          - os: windows-latest
            target: win32-x64
            name: Lime-windows-x64
            script: dist:win
            asset: dist/*.exe
            app: dist/Lime-win32-x64/resources/app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache/restore@v4
        id: vendor
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/engines.mjs', 'package-lock.json') }}
      - run: npm ci
      - name: Check the drag detection logic
        run: node test/dragwatch.test.js
      - run: node scripts/engines.mjs ${{ matrix.target }}
      - if: steps.vendor.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor
          key: ${{ steps.vendor.outputs.cache-primary-key }}
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          compression-level: 0
          retention-days: 30
      - name: Test every tool in the packaged app
        run: npm test -- "${{ matrix.app }}"
        timeout-minutes: 40
        env:
          LIME_NO_GPU: 1
      - name: Use every petal through the wheel and Save dialog
        run: npm run test:ui -- "${{ matrix.app }}"
        timeout-minutes: 40
        env:
          LIME_NO_GPU: 1
      - if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "Lime $GITHUB_REF_NAME" --notes "Lime for Mac (Apple silicon) and Windows (64-bit). See the README for first-launch steps." || true
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }} -R "$GITHUB_REPOSITORY" --clobber
