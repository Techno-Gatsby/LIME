name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSES/**']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release with this tag (for example v1.0.0); leave empty for a plain build
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            name: Lime-mac-arm64
            script: dist:mac
            asset: dist/*.dmg
            app: dist/Lime-darwin-arm64/Lime.app/Contents/Resources/app
          - os: windows-latest
            target: win32-x64
            name: Lime-windows-x64
            script: dist:win
            asset: dist/*.exe
            app: dist/Lime-win32-x64/resources/app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache/restore@v4
        id: vendor
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/*.mjs', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            vendor-${{ runner.os }}-${{ hashFiles('scripts/*.mjs', 'package-lock.json') }}-
            vendor-${{ runner.os }}-
      - run: npm ci
      - name: Check the drag detection logic
        run: node test/dragwatch.test.js
      - run: node scripts/engines.mjs ${{ matrix.target }}
      # Saved even when a step fails, so a re-run keeps every payload that was already fetched and built.
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: vendor
          key: ${{ steps.vendor.outputs.cache-primary-key }}
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.asset }}
            dist/Lime-data
          compression-level: 0
          retention-days: 30
      - name: Test every tool in the packaged app
        if: ${{ !inputs.release }}
        run: npm test -- "${{ matrix.app }}"
        timeout-minutes: 70
        env:
          LIME_NO_GPU: 1
      - name: Use every petal through the wheel and Save dialog
        if: ${{ !inputs.release }}
        run: npm run test:ui -- "${{ matrix.app }}"
        timeout-minutes: 70
        env:
          LIME_NO_GPU: 1
      # A release goes out even when a test was flaky (the failure still shows on the run); only a missing build stops it.
      - if: ${{ !cancelled() && (github.ref_type == 'tag' || inputs.release) }}
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
        run: |
          test "$TAG" = "v$(node -p 'require("./package.json").version')" || echo "::warning::The tag does not match package.json's version; the update check compares package.json versions"
          node scripts/update-feed.mjs ${{ matrix.asset }} ${{ matrix.target }}
          # Release files stop at 2 GiB, so the Windows archives travel as Lime-data.zip, which the installer unpacks.
          DATA=
          if [ -d dist/Lime-data ]; then (cd dist/Lime-data && /c/Windows/System32/tar.exe -a --options zip:compression=store -cf ../Lime-data.zip *) && DATA=dist/Lime-data.zip; fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lime $TAG" --notes "Lime for Mac (Apple silicon) and Windows (64-bit). Mac: open the .dmg and drag Lime to Applications. Windows: download both Lime-Setup-….exe and Lime-data.zip into the same folder (leave the zip as it is), then run the setup. See the README for first-launch steps." || true
          gh release upload "$TAG" ${{ matrix.asset }} $DATA dist/lime-update-${{ matrix.target }}.json -R "$GITHUB_REPOSITORY" --clobber
